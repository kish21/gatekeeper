<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GateKeeper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper:#f2f4f7; --surface:#ffffff; --ink:#1a2230; --ink-2:#5a6678; --rule:#d8dee7; --rule-2:#e9edf2;
    --allow:#0f7a6e; --allow-soft:#d9f0ec; --deny:#b3261e; --deny-soft:#f8dcda; --hold:#a35a0c; --hold-soft:#fbe6cc;
    --accent:#1f4e79; --accent-soft:#e3ecf6; --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark) { :root { --paper:#0e1218; --surface:#161c25; --ink:#e5eaf1; --ink-2:#9aa6b6; --rule:#2a3340; --rule-2:#1f2732; --allow:#3fbfae; --allow-soft:#10332f; --deny:#f07a72; --deny-soft:#3a1a18; --hold:#e4a24d; --hold-soft:#3a2a12; --accent:#7fb0e0; --accent-soft:#1c2a3a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.45; }
  a { color:var(--accent); }
  .shell { display:grid; grid-template-columns: 220px 1fr; min-height:100vh; }
  nav { background:var(--surface); border-right:1px solid var(--rule); padding:22px 16px; display:flex; flex-direction:column; gap:6px; }
  nav .brand { font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:1.35rem; margin:0 8px 18px; letter-spacing:-0.01em; }
  nav .brand small { display:block; font-family:"Source Sans 3",sans-serif; font-weight:400; font-size:0.78rem; color:var(--ink-2); letter-spacing:0.08em; text-transform:uppercase; margin-top:2px; }
  nav button { all:unset; cursor:pointer; padding:9px 12px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; color:var(--ink); }
  nav button:hover { background:var(--rule-2); }
  nav button[aria-current="page"] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  nav button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .count { font-family:var(--mono); font-size:0.75rem; background:var(--hold-soft); color:var(--hold); border-radius:999px; padding:1px 8px; }
  .count.zero { background:var(--rule-2); color:var(--ink-2); }
  nav .who { margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--rule); font-size:0.85rem; color:var(--ink-2); }
  nav .who input { width:100%; margin-top:6px; padding:7px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink); font:inherit; }
  main { padding:28px 32px 60px; max-width:1180px; }
  h1 { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.7rem; margin:0 0 4px; text-wrap:balance; }
  .sub { color:var(--ink-2); margin:0 0 20px; }
  .empty { padding:36px 20px; text-align:center; color:var(--ink-2); border:1px dashed var(--rule); border-radius:8px; }
  .cards { display:grid; gap:14px; }
  .card { background:var(--surface); border:1px solid var(--rule); border-left:4px solid var(--hold); border-radius:8px; padding:16px 18px; display:grid; grid-template-columns:1fr auto; gap:14px 24px; }
  .card .what { font-size:1.08rem; font-weight:600; }
  .card .what code, .mono { font-family:var(--mono); font-size:0.9em; }
  .card .meta { color:var(--ink-2); font-size:0.9rem; margin-top:2px; }
  .card pre { margin:10px 0 0; padding:10px 12px; background:var(--paper); border:1px solid var(--rule-2); border-radius:6px; font-family:var(--mono); font-size:0.82rem; white-space:pre-wrap; word-break:break-word; max-height:180px; overflow:auto; }
  .card .actions { display:flex; flex-direction:column; gap:8px; min-width:200px; }
  .card .actions textarea { width:100%; min-height:56px; padding:7px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink); font:inherit; font-size:0.9rem; resize:vertical; }
  .btn { cursor:pointer; border:1px solid transparent; border-radius:6px; padding:8px 14px; font:inherit; font-weight:600; }
  .btn.approve { background:var(--allow); color:#fff; }
  .btn.deny { background:var(--deny-soft); color:var(--deny); border-color:var(--deny); }
  .btn.quiet { background:var(--surface); color:var(--ink); border-color:var(--rule); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .wait { font-family:var(--mono); font-size:0.8rem; color:var(--hold); }
  table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:9px 12px; border-top:1px solid var(--rule-2); vertical-align:top; }
  thead th { border-top:0; background:var(--paper); color:var(--ink-2); font-size:0.76rem; letter-spacing:0.08em; text-transform:uppercase; }
  tbody tr.row { cursor:pointer; }
  tbody tr.row:hover { background:var(--rule-2); }
  td.mono, th.mono { font-family:var(--mono); font-size:0.82rem; font-variant-numeric:tabular-nums; }
  .chip { display:inline-block; font-family:var(--mono); font-size:0.72rem; padding:1px 8px; border-radius:999px; font-weight:500; }
  .chip.allow { background:var(--allow-soft); color:var(--allow); }
  .chip.deny { background:var(--deny-soft); color:var(--deny); }
  .chip.pending { background:var(--hold-soft); color:var(--hold); }
  .chip.read { background:var(--rule-2); color:var(--ink-2); }
  .chip.write { background:var(--accent-soft); color:var(--accent); }
  tr.detail td { background:var(--paper); padding:12px 16px 14px; }
  .steps { display:grid; gap:6px; }
  .step { display:grid; grid-template-columns: 52px 150px 84px 1fr; gap:10px; font-size:0.88rem; align-items:start; }
  .step .r { color:var(--ink); }
  .step .res { color:var(--ink-2); font-family:var(--mono); font-size:0.8rem; }
  .hashes { margin-top:10px; font-family:var(--mono); font-size:0.76rem; color:var(--ink-2); word-break:break-all; }
  .filters { display:flex; gap:10px; margin:0 0 14px; flex-wrap:wrap; }
  .filters input, .filters select { padding:7px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); color:var(--ink); font:inherit; }
  .tiles { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:22px; }
  .tile { background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; }
  .tile .n { font-family:"Fraunces",Georgia,serif; font-size:2rem; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
  .tile .l { color:var(--ink-2); font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; margin-top:6px; }
  .tile.allow .n { color:var(--allow); } .tile.deny .n { color:var(--deny); } .tile.pending .n { color:var(--hold); }
  .panel { background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:18px 20px; }
  .panel h2 { font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.2rem; margin:0 0 8px; }
  .verdict { font-family:var(--mono); font-size:1rem; padding:12px 14px; border-radius:6px; margin:12px 0; }
  .verdict.ok { background:var(--allow-soft); color:var(--allow); }
  .verdict.bad { background:var(--deny-soft); color:var(--deny); }
  .verdict.idle { background:var(--paper); color:var(--ink-2); }
  .servers { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  .server { background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; }
  .server h3 { margin:0 0 2px; font-size:1.05rem; }
  .server .cmd { font-family:var(--mono); font-size:0.76rem; color:var(--ink-2); word-break:break-all; }
  .server .tools { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .server .twin { font-size:0.78rem; color:var(--hold); margin-left:6px; }
  .toast { position:fixed; right:20px; bottom:20px; background:var(--ink); color:var(--paper); padding:10px 14px; border-radius:6px; font-size:0.9rem; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .lock { max-width:420px; margin:80px auto; }
  @media (max-width: 820px) { .shell { grid-template-columns:1fr; } nav { flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--rule); } nav .who { margin:0; border:0; width:100%; } .tiles { grid-template-columns:repeat(2,1fr); } .card { grid-template-columns:1fr; } .step { grid-template-columns:44px 1fr; } }
  @media (prefers-reduced-motion: reduce) { .toast { transition:none; } }
</style>
</head>
<body>
<div class="shell">
  <nav aria-label="Sections">
    <div class="brand">GateKeeper<small>the guard's desk</small></div>
    <button data-view="approvals" aria-current="page">Approvals <span class="count zero" id="nav-pending">0</span></button>
    <button data-view="activity">Activity</button>
    <button data-view="trust">Trust</button>
    <button data-view="servers">Servers</button>
    <div class="who">Deciding as<input id="who" placeholder="your name" autocomplete="name"></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = (s, r=document) => r.querySelector(s);
  const state = { view: 'approvals', token: localStorage.getItem('gk_ui_token') || '', who: localStorage.getItem('gk_who') || '', activity: [], open: null, filter: {q:'', verdict:''}, verify: null };
  const url = new URL(location.href);
  if (url.searchParams.get('token')) { state.token = url.searchParams.get('token'); localStorage.setItem('gk_ui_token', state.token); history.replaceState({}, '', location.pathname); }
  if (['approvals','activity','trust','servers'].includes(url.searchParams.get('view'))) state.view = url.searchParams.get('view');
  $('#who').value = state.who;
  $('#who').addEventListener('input', e => { state.who = e.target.value; localStorage.setItem('gk_who', state.who); });

  async function api(path, opts={}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    const r = await fetch(path, Object.assign({}, opts, { headers }));
    if (r.status === 401) { lock(); throw new Error('token'); }
    if (!r.ok) { let d = ''; try { d = (await r.json()).detail; } catch {} throw new Error(d || r.statusText); }
    return r.json();
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const chip = v => `<span class="chip ${esc(v)}">${esc(v)}</span>`;
  const t = ts => (ts || '').replace('T',' ').slice(0,19);
  const ago = ts => { const s = Math.max(0, (Date.now() - Date.parse(ts)) / 1000); return s < 60 ? `${Math.round(s)}s` : s < 3600 ? `${Math.round(s/60)}m` : `${Math.round(s/3600)}h`; };

  function lock() {
    $('#main').innerHTML = `<div class="lock panel"><h2>This desk needs a token</h2><p class="sub">The gateway is reachable beyond this machine, so the page requires <span class="mono">GATEKEEPER_UI_TOKEN</span>. Paste it once; it stays in this browser.</p><input id="tok" style="width:100%;padding:8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit"><p style="margin-top:10px"><button class="btn approve" id="tokgo">Open the desk</button></p></div>`;
    $('#tokgo').onclick = () => { state.token = $('#tok').value.trim(); localStorage.setItem('gk_ui_token', state.token); render(); };
  }

  // ---------------- Approvals ----------------
  async function approvals() {
    const list = await api('/ui/api/pending');
    $('#nav-pending').textContent = list.length; $('#nav-pending').classList.toggle('zero', list.length === 0);
    const main = $('#main');
    if (state.view !== 'approvals') return;
    let html = `<h1>Writes waiting for a decision</h1><p class="sub">The assistant is holding. Nothing below has happened yet, and nothing will until you say so. A request that gets no answer expires and counts as a no.</p>`;
    if (!list.length) html += `<div class="empty">Nothing is waiting. Reads pass on their own; the next write the assistant attempts will appear here.</div>`;
    html += `<div class="cards">` + list.map(r => `
      <article class="card" data-id="${esc(r.id)}">
        <div>
          <div class="what"><strong>${esc(r.principal)}</strong> <span class="meta">(${esc(r.role)})</span> wants to run <code>${esc(r.upstream)}:${esc(r.tool)}</code></div>
          <div class="meta">request <span class="mono">${esc(r.id)}</span> · waiting <span class="wait">${ago(r.ts)}</span> · since ${t(r.ts)} UTC</div>
          <pre>${esc(pretty(r.arguments_preview))}</pre>
        </div>
        <div class="actions">
          <textarea placeholder="reason (kept in the record)"></textarea>
          <button class="btn approve" data-act="approved">Approve</button>
          <button class="btn deny" data-act="denied">Deny</button>
        </div>
      </article>`).join('') + `</div>`;
    main.innerHTML = html;
    main.querySelectorAll('.card').forEach(card => card.querySelectorAll('button[data-act]').forEach(b => b.onclick = () => decide(card, b.dataset.act)));
  }
  function pretty(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } }
  async function decide(card, status) {
    if (!state.who.trim()) { toast('Type your name under "Deciding as" first'); $('#who').focus(); return; }
    const note = card.querySelector('textarea').value.trim();
    if (status === 'denied' && !note) { toast('A denial needs a reason'); card.querySelector('textarea').focus(); return; }
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const d = await api(`/ui/api/pending/${card.dataset.id}/decision`, { method:'POST', body: JSON.stringify({ status, by: state.who.trim(), note }) });
      toast(`${status === 'approved' ? 'Approved' : 'Denied'} ${d.id}: ${d.principal} → ${d.upstream}:${d.tool}`);
      await approvals();
    } catch (e) { toast(e.message); card.querySelectorAll('button').forEach(b => b.disabled = false); }
  }

  // ---------------- Activity ----------------
  async function activity() {
    state.activity = await api('/ui/api/activity');
    if (state.view !== 'activity') return;
    const f = state.filter;
    const rows = state.activity.filter(c => (!f.verdict || c.final_verdict === f.verdict) && (!f.q || `${c.principal} ${c.upstream}:${c.tool} ${c.call_id}`.toLowerCase().includes(f.q.toLowerCase())));
    $('#main').innerHTML = `<h1>Everything the assistant did</h1><p class="sub">One row per call. Click a row for the full story: each decision, who made it, and the chain hashes.</p>
      <div class="filters"><input id="q" placeholder="filter by person, tool, or id" value="${esc(f.q)}"><select id="v"><option value="">all verdicts</option><option value="allow" ${f.verdict==='allow'?'selected':''}>allowed</option><option value="deny" ${f.verdict==='deny'?'selected':''}>denied</option><option value="pending" ${f.verdict==='pending'?'selected':''}>waiting</option></select></div>
      ${rows.length ? `<table><thead><tr><th>when (UTC)</th><th>who</th><th>tool</th><th>kind</th><th>verdict</th><th class="mono">id</th></tr></thead><tbody>${rows.map(c => `
        <tr class="row" data-id="${esc(c.call_id)}"><td class="mono">${t(c.last_ts)}</td><td>${esc(c.principal)} <span class="chip read">${esc(c.role)}</span></td><td class="mono">${esc(c.upstream)}:${esc(c.tool)}</td><td>${chip(c.action)}</td><td>${chip(c.final_verdict)}</td><td class="mono">${esc(c.call_id.slice(0,12))}</td></tr>
        ${state.open === c.call_id ? `<tr class="detail"><td colspan="6">${detail(c)}</td></tr>` : ''}`).join('')}</tbody></table>` : `<div class="empty">No calls yet.</div>`}`;
    $('#q').oninput = e => { state.filter.q = e.target.value; activity(); };
    $('#v').onchange = e => { state.filter.verdict = e.target.value; activity(); };
    document.querySelectorAll('tr.row').forEach(r => r.onclick = () => { state.open = state.open === r.dataset.id ? null : r.dataset.id; activity(); });
  }
  function detail(c) {
    return `<div class="steps">${c.entries.map(e => `<div class="step"><span class="mono">#${e.seq}</span><span class="mono">${t(e.ts)}</span>${chip(e.verdict)}<span class="r">${esc(e.reason)}${e.result ? ` <span class="res">· ${esc(e.result)}</span>` : ''}</span></div>`).join('')}</div><div class="hashes">call ${esc(c.call_id)}</div>`;
  }

  // ---------------- Trust ----------------
  async function trust() {
    const s = await api('/ui/api/summary');
    if (state.view !== 'trust') return;
    if (!state.verify) { try { state.verify = await api('/ui/api/verify', { method:'POST' }); } catch {} }
    const v = state.verify;
    $('#main').innerHTML = `<h1>Can the record be trusted?</h1><p class="sub">Every entry carries a keyed hash of itself and of the one before it. The check walks the whole chain and stops at the first record that does not fit.</p>
      <div class="tiles"><div class="tile"><div class="n">${s.calls}</div><div class="l">calls recorded</div></div><div class="tile allow"><div class="n">${s.by_verdict.allow||0}</div><div class="l">allowed</div></div><div class="tile deny"><div class="n">${s.by_verdict.deny||0}</div><div class="l">denied</div></div><div class="tile pending"><div class="n">${s.pending}</div><div class="l">waiting now</div></div></div>
      <div class="panel"><h2>Integrity check</h2>
        <div class="verdict ${v ? (v.ok ? 'ok' : 'bad') : 'idle'}">${v ? (v.ok ? `OK — chain intact, ${v.checked} entries verified` : `TAMPERED — ${v.broken_at != null ? 'broken at #' + v.broken_at + ': ' : ''}${esc(v.detail)} (${v.checked} verified before the break)`) : 'Not checked yet in this session.'}</div>
        <p><button class="btn approve" id="verify">Verify the ledger now</button> <span class="mono" style="font-size:.78rem;color:var(--ink-2)">head ${esc(s.head)}</span></p>
        <p class="sub" style="margin-top:12px">Keep the head hash somewhere the ledger's machine cannot reach. Passing it back later (<span class="mono">gatekeeper verify --expect-head</span>) also detects records removed from the end of the chain.</p>
      </div>`;
    $('#verify').onclick = async () => { $('#verify').disabled = true; try { state.verify = await api('/ui/api/verify', { method:'POST' }); } catch (e) { toast(e.message); } trust(); };
  }

  // ---------------- Servers ----------------
  async function servers() {
    const list = await api('/ui/api/servers');
    if (state.view !== 'servers') return;
    const policy = (list.find(s => s.name === '_policy') || {}).approval || {};
    const items = list.filter(s => s.name !== '_policy');
    $('#main').innerHTML = `<h1>What the guard stands in front of</h1><p class="sub">Every tool below is only reachable through the gateway. Reads pass; writes ${policy.writes === 'require' ? `wait for a person (timeout ${esc(policy.timeout_s)} s; exempt roles: ${esc((policy.exempt_roles||[]).join(', ') || 'none')})` : 'pass without a person'}. Add a server by adding a block to <span class="mono">config/upstreams.yaml</span>.</p>
      <div class="servers">${items.map(s => `<div class="server"><h3>${esc(s.name)}${s.twin ? `<span class="twin">demo twin of ${esc(s.of)}</span>` : ''}</h3><div class="cmd">${esc(s.command)}</div><div class="tools">${s.reads.map(x => `<span class="chip read">${esc(x)}</span>`).join('')}${s.writes.map(x => `<span class="chip write">${esc(x)}</span>`).join('')}</div></div>`).join('')}</div>`;
  }

  // ---------------- routing + polling ----------------
  const views = { approvals, activity, trust, servers };
  async function render() { try { await views[state.view](); } catch (e) { if (e.message !== 'token') $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
  document.querySelectorAll('nav button[data-view]').forEach(b => b.onclick = () => { state.view = b.dataset.view; document.querySelectorAll('nav button[data-view]').forEach(x => x.removeAttribute('aria-current')); b.setAttribute('aria-current','page'); render(); });
  document.querySelectorAll('nav button[data-view]').forEach(b => { if (b.dataset.view === state.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  render();
  setInterval(async () => { try { if (state.view === 'approvals') await approvals(); else { const l = await api('/ui/api/pending'); $('#nav-pending').textContent = l.length; $('#nav-pending').classList.toggle('zero', l.length === 0); if (state.view === 'activity' && !state.open) await activity(); } } catch {} }, 2000);
})();
</script>
</body>
</html>
