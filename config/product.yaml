# product.yaml — how calls are JUDGED (what counts as a write).
#
# A call is a "write" if the tool is listed under `writes:` for its server in upstreams.yaml
# (that annotation wins), or, when the server has no annotation, if the tool name matches one of
# these patterns. Read-only roles are denied writes by policies/gatekeeper.cedar.

write_detection:
  name_patterns: ["create*", "update*", "delete*", "write*", "put*", "exec*", "run*", "send*"]

# Human approval of writes. A write the policy allows is HELD until someone runs
# `gatekeeper approve <id>` (or `deny`); no decision within the timeout is a deny. Reads are
# never held. GATEKEEPER_APPROVAL_WRITES=require|off and GATEKEEPER_APPROVAL_TIMEOUT_S override.
approval:
  writes: require
  timeout_s: 90            # keep under your MCP host's tool timeout so a late approval can't act
  exempt_roles: [admin]    # roles whose writes go straight through (still recorded)
