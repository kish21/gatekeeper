# product.yaml — how calls are JUDGED (what counts as a write).
#
# A call is a "write" if the tool is listed under `writes:` for its server in upstreams.yaml
# (that annotation wins), or, when the server has no annotation, if the tool name matches one of
# these patterns. Read-only roles are denied writes by policies/gatekeeper.cedar.

write_detection:
  name_patterns: ["create*", "update*", "delete*", "write*", "put*", "exec*", "run*", "send*"]

# Human approval of writes. A write the policy allows is HELD until someone decides it at the desk
# or with `gatekeeper approve <id>`; no decision within the timeout is a deny. Reads are never held.
# GATEKEEPER_APPROVAL_WRITES=require|off and GATEKEEPER_APPROVAL_TIMEOUT_S override.
approval:
  writes: require
  # How long a held write waits. Keep it under your MCP host's tool timeout, or a late approval
  # arrives after the agent has already given up. Five minutes suits a notified approver; lower it
  # if your host is impatient.
  timeout_s: 300
  exempt_roles: [admin]    # roles whose writes go straight through (still recorded)

  # --- who may release a held write ---------------------------------------------------------
  # Roles allowed to decide. Empty = any identity the gateway can authenticate. Name your approver
  # group here (an OIDC group mapped to this role, or a role in identities.yaml).
  approver_roles: [approver, admin]
  # Nobody approves their own call. This is the difference between a gate and a formality.
  four_eyes: true
  # Allow `gatekeeper approve` from a shell on the gateway host. That shell is privileged, but it
  # is not a login: decisions made this way are recorded as `console`. Set false to require a
  # verified approver for every release.
  console_approvals: true

# --- how risky is a write? (M2.1) --------------------------------------------------------------
# Holding EVERY write is the right way to start and the wrong place to stay: forty approvals a day
# turns a careful reviewer into a clicking machine, and the one that mattered goes through with the
# rest. So each write is scored, and `hold_at` decides which ones are worth a person.
#
# The score never changes allow/deny — the rulebook in policies/ does that. It decides how much
# human attention a write earns. It is arithmetic over the same attributes the policy sees, so a
# score can be explained to whoever was woken up by it, and reproduced later in an audit.
#
# `hold_at: 0` means every write waits for a person. That is the default deliberately: run it that
# way until you can see what your assistants actually do, then raise it. A sensible second step is
# 0.5 with the signals below, which holds anything touching production, customer data, destructive
# wording, outside recipients or large amounts, and lets ordinary work through.
risk:
  hold_at: 0                 # >= this stops at the desk. 0 = hold every write.
  base: 0.3                  # a write with no signals is still a change to a real system

  signals:
    - id: production-branch
      weight: 0.4
      attribute: branch
      equals: [main, master, production, prod, release]

    - id: destructive-wording
      weight: 0.4
      text: ["delete ", "drop ", "truncate", "purge", "revoke", "--force", "rm -rf"]

    - id: customer-or-payment-data
      weight: 0.3
      attribute: table
      equals: [customers, payments, invoices, users, accounts]

    - id: recipient-outside-the-company
      weight: 0.4
      attribute: domains
      outside: [corp.example]   # put YOUR domains here; anything else counts as outside

    - id: large-amount
      weight: 0.3
      attribute: amount
      at_least: 10000

    - id: secrets-path
      weight: 0.4
      text: ["/secrets/", ".env", "credential", "private_key"]

  # The handful nobody wants automated, whatever they score.
  always_hold:
    - github:merge_pull_request
    - github:delete_branch
    - database:execute

  # Holes in the gate, by choice. Keep this list empty unless you can say why.
  never_hold: []
