# identities.yaml — static token -> principal -> role map (the dev/demo identity adapter).
# DEV/DEMO ONLY. These tokens are public placeholders (allowlisted in .gitleaks.toml). The gateway
# REFUSES to serve them on a network-reachable interface. For a real deployment either:
#   * set GATEKEEPER_IDENTITIES="principal:role:token;..." with your own tokens (replaces this file), or
#   * switch to corporate login: GATEKEEPER_IDENTITY=oidc (see docs/features/oidc-identity.md).

principals:
  - token: dev-token-alice-REPLACE-ME
    principal: alice
    role: operator        # may read + request writes (writes need approval in M2)

  - token: dev-token-bob-REPLACE-ME
    principal: bob
    role: readonly        # may read only; writes denied by policy

  - token: dev-token-root-REPLACE-ME
    principal: root
    role: admin           # may read + write (still audited; still approval-gated in M2)
