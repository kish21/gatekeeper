# platform.yaml — how the gateway RUNS (transport, identity, storage, alerting).
#
# Every value here can also be set from the environment, which is how a hosted deployment is
# configured without touching this file. The variable name is shown next to each knob.
# Secrets never live here: GATEKEEPER_HMAC_KEY, GATEKEEPER_AGENT_TOKEN and any upstream
# credentials come from .env or the deployment environment.
#
# Relative paths resolve against the project root (the parent of this config/ folder), so the
# gateway works no matter which directory an MCP host launches it from.

transport:
  mode: stdio                      # GATEKEEPER_TRANSPORT            stdio | http
  http_host: 127.0.0.1             # GATEKEEPER_HTTP_HOST            loopback unless acked below
  http_port: 8765                  # GATEKEEPER_HTTP_PORT
  http_path: /mcp                  # GATEKEEPER_HTTP_PATH
  http_allow_non_loopback: false   # GATEKEEPER_HTTP_ALLOW_NON_LOOPBACK  required to bind 0.0.0.0
  http_allowed_origins: []         # GATEKEEPER_HTTP_ALLOWED_ORIGINS (comma-separated)
  # Public hostnames the HTTP transport accepts (a hosted FQDN). List each host once; the
  # gateway accepts it with and without a port. Azure Container Apps' CONTAINER_APP_HOSTNAME is
  # trusted automatically, so a hosted deploy needs no entry here.
  http_allowed_hosts: []           # GATEKEEPER_HTTP_ALLOWED_HOSTS (comma-separated)

adapters:
  identity: static_token           # GATEKEEPER_IDENTITY             static_token | oidc
  policy: cedar

# OIDC identity — used only when adapters.identity is oidc. Every field can come from the
# environment (GATEKEEPER_OIDC_ISSUER, _AUDIENCE, _GROUP_ROLE_MAP="group-id=role,...",
# _JWKS_URL, _PRINCIPAL_CLAIM, _GROUPS_CLAIM). Tokens are validated against the IdP's public
# JWKS keys; no secret is needed. See docs/features/oidc-identity.md.
# identity:
#   oidc:
#     issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
#     audience: <the gateway app's client-id or api://... identifier>
#     group_role_map:              # IdP group -> gateway role; first match wins;
#       <group-object-id>: operator  #   unmapped groups are denied
#       <group-object-id>: readonly
#     principal_claim: sub         # Entra alternatives: oid, preferred_username
#     groups_claim: groups
#     leeway_s: 30                 # clock-skew tolerance

ledger:
  path: ./.gatekeeper/audit.db     # GATEKEEPER_LEDGER_PATH
  hash_algo: hmac-sha256           # the chain's keyed hash (key = GATEKEEPER_HMAC_KEY)

policy:
  dir: ./policies                  # GATEKEEPER_POLICY_DIR           directory of .cedar files

resilience:
  upstream: { timeout: 30 }        # seconds a forwarded call may take before it fails closed

# Operator alerting: a deny spike in this window fires the webhook in GATEKEEPER_ALERT_WEBHOOK.
observability:
  deny_spike: { window_s: 60, threshold: 10 }

# Latency budgets checked by the benchmark harness (tests/eval), not by the gateway itself.
perf:
  overhead_p95_ms: 10.0
  http_transport_overhead_p95_ms: 5.0
